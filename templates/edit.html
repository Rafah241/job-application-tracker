<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Application</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="form-container">

        <h1>Edit Application</h1>

        <form action="/edit/{{ job['id'] }}" method="POST">

            <div class="form-group">
                <label for="company">Company</label>

                <input
                    type="text"
                    id="company"
                    name="company"
                    value="{{ job['company'] }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="role">Job Role</label>

                <input
                    type="text"
                    id="role"
                    name="role"
                    value="{{ job['role'] }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="date">Date Applied</label>

                <input
                    type="date"
                    id="date"
                    name="date_applied"
                    value="{{ job['date_applied'] }}"
                >
            </div>

            <div class="form-group">
                <label for="status">Status</label>

                <select id="status" name="status">

                    <option value="Applied"
                        {% if job['status'] == 'Applied' %}selected{% endif %}>
                        Applied
                    </option>

                    <option value="Assessment"
                        {% if job['status'] == 'Assessment' %}selected{% endif %}>
                        Assessment
                    </option>

                    <option value="Interview"
                        {% if job['status'] == 'Interview' %}selected{% endif %}>
                        Interview
                    </option>

                    <option value="Selected"
                        {% if job['status'] == 'Selected' %}selected{% endif %}>
                        Selected
                    </option>

                    <option value="Rejected"
                        {% if job['status'] == 'Rejected' %}selected{% endif %}>
                        Rejected
                    </option>

                </select>
            </div>

            <div class="form-group">
                <label for="link">Job Link</label>

                <input
                    type="url"
                    id="link"
                    name="job_link"
                    value="{{ job['job_link'] }}"
                >
            </div>

            <div class="form-group">
                <label for="notes">Notes</label>

                <textarea
                    id="notes"
                    name="notes"
                >{{ job['notes'] }}</textarea>
            </div>

            <button type="submit">
                Save Changes
            </button>

        </form>

        <br>

        <a href="/">← Back to Applications</a>

    </div>

</body>

</html>
